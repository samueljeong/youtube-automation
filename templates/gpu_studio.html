<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPU Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        [x-cloak] { display: none !important; }
        .loader { border-top-color: #3b82f6; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen" x-data="gpuStudio()">
    <!-- Header -->
    <header class="bg-gray-800 border-b border-gray-700 px-6 py-4">
        <div class="flex items-center justify-between">
            <h1 class="text-2xl font-bold">GPU Studio</h1>
            <div class="flex items-center gap-4">
                <div class="flex items-center gap-2">
                    <span class="text-sm text-gray-400">ComfyUI</span>
                    <span :class="status.comfyui?.available ? 'bg-green-500' : 'bg-red-500'"
                          class="w-3 h-3 rounded-full"></span>
                </div>
                <div class="flex items-center gap-2">
                    <span class="text-sm text-gray-400">XTTS</span>
                    <span :class="status.xtts?.available ? 'bg-green-500' : 'bg-red-500'"
                          class="w-3 h-3 rounded-full"></span>
                </div>
                <div class="flex items-center gap-2">
                    <span class="text-sm text-gray-400">SVD</span>
                    <span :class="status.svd?.available ? 'bg-green-500' : 'bg-yellow-500'"
                          class="w-3 h-3 rounded-full"></span>
                </div>
                <button @click="checkStatus()" class="text-sm text-blue-400 hover:text-blue-300">
                    새로고침
                </button>
            </div>
        </div>
    </header>

    <div class="flex h-[calc(100vh-73px)]">
        <!-- Sidebar -->
        <aside class="w-64 bg-gray-800 border-r border-gray-700 p-4">
            <nav class="space-y-2">
                <button @click="activeTab = 'image'"
                        :class="activeTab === 'image' ? 'bg-blue-600' : 'hover:bg-gray-700'"
                        class="w-full text-left px-4 py-3 rounded-lg flex items-center gap-3">
                    <span class="text-xl">🎨</span>
                    <span>이미지 생성</span>
                </button>
                <button @click="activeTab = 'tts'"
                        :class="activeTab === 'tts' ? 'bg-blue-600' : 'hover:bg-gray-700'"
                        class="w-full text-left px-4 py-3 rounded-lg flex items-center gap-3">
                    <span class="text-xl">🎤</span>
                    <span>TTS 음성</span>
                </button>
                <button @click="activeTab = 'video'"
                        :class="activeTab === 'video' ? 'bg-blue-600' : 'hover:bg-gray-700'"
                        class="w-full text-left px-4 py-3 rounded-lg flex items-center gap-3">
                    <span class="text-xl">🎬</span>
                    <span>이미지→영상</span>
                </button>
            </nav>

            <!-- History -->
            <div class="mt-8">
                <h3 class="text-sm font-semibold text-gray-400 mb-3">최근 결과</h3>
                <div class="space-y-2 max-h-64 overflow-y-auto">
                    <template x-for="item in history" :key="item.filename">
                        <div @click="selectResult(item)"
                             class="p-2 bg-gray-700 rounded cursor-pointer hover:bg-gray-600 text-sm truncate">
                            <span x-text="item.filename"></span>
                        </div>
                    </template>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 p-6 overflow-auto">
            <!-- Image Generation -->
            <div x-show="activeTab === 'image'" x-cloak>
                <h2 class="text-xl font-bold mb-4">🎨 Flux 이미지 생성</h2>

                <div class="bg-gray-800 rounded-xl p-6 mb-6">
                    <div class="mb-4">
                        <label class="block text-sm font-medium mb-2">프롬프트</label>
                        <textarea x-model="imagePrompt" rows="3"
                                  placeholder="생성할 이미지를 설명하세요..."
                                  class="w-full bg-gray-700 rounded-lg px-4 py-3 focus:ring-2 focus:ring-blue-500 focus:outline-none"></textarea>
                    </div>

                    <div class="grid grid-cols-3 gap-4 mb-4">
                        <div>
                            <label class="block text-sm font-medium mb-2">크기</label>
                            <select x-model="imageSize" class="w-full bg-gray-700 rounded-lg px-4 py-2">
                                <option value="1280x720">16:9 (1280x720)</option>
                                <option value="720x1280">9:16 (720x1280)</option>
                                <option value="1024x1024">1:1 (1024x1024)</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-2">스텝</label>
                            <input type="number" x-model="imageSteps" min="1" max="20"
                                   class="w-full bg-gray-700 rounded-lg px-4 py-2">
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-2">시드</label>
                            <input type="number" x-model="imageSeed" placeholder="랜덤"
                                   class="w-full bg-gray-700 rounded-lg px-4 py-2">
                        </div>
                    </div>

                    <button @click="generateImage()"
                            :disabled="loading"
                            class="w-full bg-blue-600 hover:bg-blue-700 disabled:bg-gray-600 py-3 rounded-lg font-semibold flex items-center justify-center gap-2">
                        <span x-show="loading" class="loader w-5 h-5 border-2 border-white rounded-full"></span>
                        <span x-text="loading ? '생성 중...' : '이미지 생성'"></span>
                    </button>
                </div>

                <!-- Result -->
                <div x-show="result.image" class="bg-gray-800 rounded-xl p-6">
                    <h3 class="font-semibold mb-4">생성 결과</h3>
                    <img :src="result.image" class="max-w-full rounded-lg mx-auto">
                </div>
            </div>

            <!-- TTS -->
            <div x-show="activeTab === 'tts'" x-cloak>
                <h2 class="text-xl font-bold mb-4">🎤 XTTS 음성 생성</h2>

                <div class="bg-gray-800 rounded-xl p-6 mb-6">
                    <div class="mb-4">
                        <label class="block text-sm font-medium mb-2">텍스트</label>
                        <textarea x-model="ttsText" rows="4"
                                  placeholder="음성으로 변환할 텍스트를 입력하세요..."
                                  class="w-full bg-gray-700 rounded-lg px-4 py-3 focus:ring-2 focus:ring-blue-500 focus:outline-none"></textarea>
                    </div>

                    <div class="grid grid-cols-2 gap-4 mb-4">
                        <div>
                            <label class="block text-sm font-medium mb-2">언어</label>
                            <select x-model="ttsLanguage" class="w-full bg-gray-700 rounded-lg px-4 py-2">
                                <option value="ko">한국어</option>
                                <option value="en">영어</option>
                                <option value="ja">일본어</option>
                                <option value="zh-cn">중국어</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-2">참조 음성 (선택)</label>
                            <input type="file" accept="audio/*"
                                   class="w-full bg-gray-700 rounded-lg px-4 py-2 text-sm">
                        </div>
                    </div>

                    <button @click="generateTTS()"
                            :disabled="loading"
                            class="w-full bg-green-600 hover:bg-green-700 disabled:bg-gray-600 py-3 rounded-lg font-semibold flex items-center justify-center gap-2">
                        <span x-show="loading" class="loader w-5 h-5 border-2 border-white rounded-full"></span>
                        <span x-text="loading ? '생성 중...' : '음성 생성'"></span>
                    </button>
                </div>

                <!-- Result -->
                <div x-show="result.audio" class="bg-gray-800 rounded-xl p-6">
                    <h3 class="font-semibold mb-4">생성 결과</h3>
                    <audio :src="result.audio" controls class="w-full"></audio>
                </div>
            </div>

            <!-- Video -->
            <div x-show="activeTab === 'video'" x-cloak>
                <h2 class="text-xl font-bold mb-4">🎬 SVD 이미지→영상</h2>

                <div class="bg-gray-800 rounded-xl p-6 mb-6">
                    <div class="mb-4">
                        <label class="block text-sm font-medium mb-2">이미지 선택</label>
                        <div class="border-2 border-dashed border-gray-600 rounded-lg p-8 text-center">
                            <input type="file" accept="image/*" @change="handleVideoImage($event)"
                                   class="hidden" id="videoImageInput">
                            <label for="videoImageInput" class="cursor-pointer">
                                <div x-show="!videoImagePreview" class="text-gray-400">
                                    <span class="text-4xl">📷</span>
                                    <p class="mt-2">클릭하여 이미지 선택</p>
                                </div>
                                <img x-show="videoImagePreview" :src="videoImagePreview"
                                     class="max-h-64 mx-auto rounded-lg">
                            </label>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-4 mb-4">
                        <div>
                            <label class="block text-sm font-medium mb-2">프레임 수</label>
                            <select x-model="videoFrames" class="w-full bg-gray-700 rounded-lg px-4 py-2">
                                <option value="14">14 프레임</option>
                                <option value="25">25 프레임</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-2">FPS</label>
                            <select x-model="videoFps" class="w-full bg-gray-700 rounded-lg px-4 py-2">
                                <option value="6">6 FPS</option>
                                <option value="8">8 FPS</option>
                                <option value="12">12 FPS</option>
                            </select>
                        </div>
                    </div>

                    <button @click="generateVideo()"
                            :disabled="loading || !status.svd?.available"
                            class="w-full bg-purple-600 hover:bg-purple-700 disabled:bg-gray-600 py-3 rounded-lg font-semibold flex items-center justify-center gap-2">
                        <span x-show="loading" class="loader w-5 h-5 border-2 border-white rounded-full"></span>
                        <span x-text="loading ? '생성 중...' : (status.svd?.available ? '영상 생성' : 'SVD 다운로드 중...')"></span>
                    </button>
                </div>

                <!-- Result -->
                <div x-show="result.video" class="bg-gray-800 rounded-xl p-6">
                    <h3 class="font-semibold mb-4">생성 결과</h3>
                    <video :src="result.video" controls class="w-full rounded-lg"></video>
                </div>
            </div>
        </main>
    </div>

    <!-- Toast -->
    <div x-show="toast.show" x-cloak
         x-transition:enter="transition ease-out duration-300"
         x-transition:leave="transition ease-in duration-200"
         :class="toast.type === 'error' ? 'bg-red-600' : 'bg-green-600'"
         class="fixed bottom-4 right-4 px-6 py-3 rounded-lg shadow-lg">
        <span x-text="toast.message"></span>
    </div>

    <script>
        function gpuStudio() {
            return {
                activeTab: 'image',
                loading: false,
                status: {},
                history: [],
                toast: { show: false, message: '', type: 'success' },
                result: { image: null, audio: null, video: null },

                // Image
                imagePrompt: '',
                imageSize: '1280x720',
                imageSteps: 4,
                imageSeed: null,

                // TTS
                ttsText: '',
                ttsLanguage: 'ko',

                // Video
                videoImagePreview: null,
                videoImagePath: null,
                videoFrames: 14,
                videoFps: 8,

                async init() {
                    await this.checkStatus();
                    await this.loadHistory();
                },

                async checkStatus() {
                    try {
                        const res = await fetch('/api/gpu/status');
                        this.status = await res.json();
                    } catch (e) {
                        console.error('Status check failed:', e);
                    }
                },

                async loadHistory() {
                    try {
                        const res = await fetch('/api/gpu/history');
                        const data = await res.json();
                        this.history = data.history || [];
                    } catch (e) {
                        console.error('History load failed:', e);
                    }
                },

                showToast(message, type = 'success') {
                    this.toast = { show: true, message, type };
                    setTimeout(() => this.toast.show = false, 3000);
                },

                async generateImage() {
                    if (!this.imagePrompt.trim()) {
                        this.showToast('프롬프트를 입력하세요', 'error');
                        return;
                    }

                    this.loading = true;
                    this.result.image = null;

                    try {
                        const res = await fetch('/api/gpu/image', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                prompt: this.imagePrompt,
                                size: this.imageSize,
                                steps: parseInt(this.imageSteps),
                                seed: this.imageSeed ? parseInt(this.imageSeed) : null
                            })
                        });

                        const data = await res.json();

                        if (data.ok) {
                            this.result.image = data.image_url;
                            this.showToast('이미지 생성 완료!');
                            this.loadHistory();
                        } else {
                            this.showToast(data.error || '생성 실패', 'error');
                        }
                    } catch (e) {
                        this.showToast('오류: ' + e.message, 'error');
                    } finally {
                        this.loading = false;
                    }
                },

                async generateTTS() {
                    if (!this.ttsText.trim()) {
                        this.showToast('텍스트를 입력하세요', 'error');
                        return;
                    }

                    this.loading = true;
                    this.result.audio = null;

                    try {
                        const res = await fetch('/api/gpu/tts', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                text: this.ttsText,
                                language: this.ttsLanguage
                            })
                        });

                        const data = await res.json();

                        if (data.ok) {
                            this.result.audio = '/' + data.audio_path;
                            this.showToast('음성 생성 완료!');
                            this.loadHistory();
                        } else {
                            this.showToast(data.error || '생성 실패', 'error');
                        }
                    } catch (e) {
                        this.showToast('오류: ' + e.message, 'error');
                    } finally {
                        this.loading = false;
                    }
                },

                handleVideoImage(event) {
                    const file = event.target.files[0];
                    if (file) {
                        this.videoImagePreview = URL.createObjectURL(file);
                        // TODO: Upload file and get path
                    }
                },

                async generateVideo() {
                    this.showToast('SVD 영상 생성은 준비 중입니다', 'error');
                },

                selectResult(item) {
                    if (item.type === 'image') {
                        this.result.image = '/' + item.path;
                        this.activeTab = 'image';
                    } else if (item.type === 'audio') {
                        this.result.audio = '/' + item.path;
                        this.activeTab = 'tts';
                    } else if (item.type === 'video') {
                        this.result.video = '/' + item.path;
                        this.activeTab = 'video';
                    }
                }
            }
        }
    </script>
</body>
</html>
